name: CI

# Pull requests: tests only.
# Push to main: tests -> next version from Conventional Commits -> Linux and Windows builds -> tag + GitHub release.
# Push of a manual vX.Y.Z tag: tests -> version taken from the tag -> Linux and Windows builds -> GitHub release.
# Tags created by this workflow (GITHUB_TOKEN) do not start a new run, so a release is never built twice.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet test -c Release

  version:
    name: Version
    needs: test
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # The version computed here is what the build and release jobs consume.
    outputs:
      version: ${{ steps.semver.outputs.new_version || steps.manual.outputs.version }}
      tag: ${{ steps.semver.outputs.new_tag || steps.manual.outputs.tag }}
      changelog: ${{ steps.semver.outputs.changelog }}
    steps:
      # Dry run: only computes the version. The tag is created by the release job, after the builds succeed.
      # default_bump false: only feat, fix/perf and breaking changes produce a release.
      - name: Compute the next version (semver)
        id: semver
        if: github.ref_type == 'branch'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          tag_prefix: v
          default_bump: false
          dry_run: true

      # A manually pushed tag is the version itself: no bump, the release is built for that tag.
      - name: Take the version from the pushed tag
        id: manual
        if: github.ref_type == 'tag'
        run: |
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish the versions to the log, summary and environment
        env:
          PREVIOUS_VERSION: ${{ steps.semver.outputs.previous_version }}
          PREVIOUS_TAG: ${{ steps.semver.outputs.previous_tag }}
          NEW_VERSION: ${{ steps.semver.outputs.new_version || steps.manual.outputs.version }}
          NEW_TAG: ${{ steps.semver.outputs.new_tag || steps.manual.outputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "$NEW_VERSION" ]; then
            echo "No new version from the commits since ${PREVIOUS_TAG:-the start of the history}."
            # Without any tag the action compares HEAD with HEAD and sees no commits at all.
            if [ "$PREVIOUS_TAG" = "v0.0.0" ]; then
              echo "::warning title=No version tag::No vX.Y.Z tag exists, so no commit was analyzed. Create an initial tag (git tag v0.1.0 <commit> && git push origin v0.1.0) and re-run."
            fi
          else
            echo "Previous version: ${PREVIOUS_VERSION:-<none>} (${PREVIOUS_TAG:-<no tag>})"
            echo "New version:      $NEW_VERSION ($NEW_TAG)"
          fi

          # Also in the run summary, so the log does not need to be opened.
          {
            echo "### Version"
            echo ""
            echo "| | Version | Tag |"
            echo "| --- | --- | --- |"
            echo "| Previous | ${PREVIOUS_VERSION:-—} | ${PREVIOUS_TAG:-—} |"
            echo "| New | ${NEW_VERSION:-— (no release)} | ${NEW_TAG:-—} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Available to the next steps of this job as $NEW_VERSION, $NEW_TAG, $PREVIOUS_VERSION and $PREVIOUS_TAG.
          {
            echo "PREVIOUS_VERSION=$PREVIOUS_VERSION"
            echo "PREVIOUS_TAG=$PREVIOUS_TAG"
            echo "NEW_VERSION=$NEW_VERSION"
            echo "NEW_TAG=$NEW_TAG"
          } >> "$GITHUB_ENV"

  build:
    name: Build (${{ matrix.rid }})
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: linux-x64
            archive: tar.gz
          - rid: win-x64
            archive: zip
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish
        run: >
          dotnet publish src/FlareSync.Cli -c Release -r ${{ matrix.rid }} -o publish
          -p:Version=$VERSION -p:DebugType=none
      - name: Package
        run: |
          cp README.md publish/
          name="flaresync-$VERSION-${{ matrix.rid }}"
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            cp deploy/flaresync.service publish/
            tar -czf "$name.tar.gz" -C publish .
          else
            (cd publish && zip -r "../$name.zip" .)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: flaresync-${{ matrix.rid }}
          path: flaresync-${{ env.VERSION }}-${{ matrix.rid }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          CHANGELOG: ${{ needs.version.outputs.changelog }}
        run: |
          # Manual tags have no computed changelog: let GitHub generate the notes.
          if [ -n "$CHANGELOG" ]; then
            printf '%s\n' "$CHANGELOG" > notes.md
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi

          # Creates the tag on this commit when it does not exist yet (automatic version); a manual tag is reused.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            "${notes[@]}"
