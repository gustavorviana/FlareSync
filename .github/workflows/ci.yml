name: CI

# Pull requests: tests only.
# Push to main: tests -> next version from Conventional Commits -> Linux and Windows builds -> tag + GitHub release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet test -c Release

  version:
    name: Version
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.new_version }}
      tag: ${{ steps.tag.outputs.new_tag }}
      changelog: ${{ steps.tag.outputs.changelog }}
    steps:
      # Dry run: only compute the version. The tag is created by the release job, after the builds succeed.
      - id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          tag_prefix: v
          default_bump: false
          dry_run: true
      - name: Summary
        run: |
          if [ -n "${{ steps.tag.outputs.new_version }}" ]; then
            echo "Next version: ${{ steps.tag.outputs.new_tag }} (${{ steps.tag.outputs.release_type }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No feat/fix/perf or breaking commit since ${{ steps.tag.outputs.previous_tag }}: no release." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build (${{ matrix.rid }})
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: linux-x64
            archive: tar.gz
          - rid: win-x64
            archive: zip
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish
        run: >
          dotnet publish src/FlareSync.Cli -c Release -r ${{ matrix.rid }} -o publish
          -p:Version=$VERSION -p:DebugType=none
      - name: Package
        run: |
          cp README.md publish/
          name="flaresync-$VERSION-${{ matrix.rid }}"
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            cp deploy/flaresync.service publish/
            tar -czf "$name.tar.gz" -C publish .
          else
            (cd publish && zip -r "../$name.zip" .)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: flaresync-${{ matrix.rid }}
          path: flaresync-${{ env.VERSION }}-${{ matrix.rid }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          CHANGELOG: ${{ needs.version.outputs.changelog }}
        run: |
          printf '%s\n' "$CHANGELOG" > notes.md
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.md
